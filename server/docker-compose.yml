# Local development services: `docker compose up -d`, then `npm run db:migrate`.
# Matches the defaults in .env.example.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mit8333
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mit8333']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the API sends; read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025' # SMTP (SMTP_URL=smtp://localhost:1025)
      - '8025:8025' # web inbox

volumes:
  postgres-data:
